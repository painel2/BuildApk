name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake unzip wget
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Setup Android NDK r25b
        run: |
          cd /home/runner
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          rm android-ndk-r25b-linux.zip

      - name: Install Python packages target
        run: |
          pip install --target=. requests urllib3 certifi idna charset_normalizer

      - name: Ensure FFmpeg binary permissions
        run: |
          chmod +x bin/ffmpeg || true

      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_HOME: '/home/runner/android-ndk-r25b'
          ANDROID_NDK_ROOT: '/home/runner/android-ndk-r25b'
          ANDROID_NDK: '/home/runner/android-ndk-r25b'
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
