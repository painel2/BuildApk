name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libsqlite3-dev build-essential
          pip install --upgrade pip setuptools buildozer cython

      - name: Build APK with Buildozer
        run: |
          buildozer -s android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitch-clip-app
          path: bin/*.apk
